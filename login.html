<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — MindMate</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-auth-page="1">
<div class="auth-wrap">
  <div class="glass auth-card">
    <div class="logo"><div class="logo-mark">✨</div> MindMate</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to continue your conversation</p>

    <form id="login-form">
      <div class="form-group">
        <label class="field-label">Email</label>
        <input class="input" type="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="field-label">Password</label>
        <div class="password-field">
          <input class="input" type="password" name="password" id="login-password" required placeholder="••••••••">
          <button type="button" class="toggle-pass" onclick="togglePasswordField('login-password', this)">Show</button>
        </div>
      </div>
      <div class="row-between">
        <label class="checkbox-line"><input type="checkbox" name="remember"> Remember me</label>
        <a href="forgot-password.html">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary">Log In</button>
      <div class="error-msg" id="auth-error"></div>
    </form>

    <div class="divider">OR</div>
    <div class="social-row">
      <button class="btn btn-secondary social-btn" type="button" onclick="showToast('Connect a Google OAuth client to enable this.', 'info')">Google</button>
      <button class="btn btn-secondary social-btn" type="button" onclick="showToast('Connect a GitHub OAuth app to enable this.', 'info')">GitHub</button>
    </div>

    <div class="auth-footer">Don't have an account? <a href="register.html">Sign up</a></div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
