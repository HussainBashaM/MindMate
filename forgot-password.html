<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — MindMate</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-auth-page="1">
<div class="auth-wrap">
  <div class="glass auth-card">
    <div class="logo"><div class="logo-mark">✨</div> MindMate</div>
    <h1>Reset your password</h1>
    <p class="subtitle">Enter your email and we'll send you a reset link</p>

    <form id="forgot-form">
      <div class="form-group">
        <label class="field-label">Email</label>
        <input class="input" type="email" name="email" required placeholder="you@example.com">
      </div>
      <button type="submit" class="btn btn-primary">Send Reset Link</button>
      <div class="error-msg" id="auth-error"></div>
    </form>

    <div id="forgot-success" style="display:none;text-align:center;color:var(--green);font-size:14px;">
      If that email exists, a reset link has been sent. Check your inbox.
    </div>

    <div class="auth-footer">Remembered it? <a href="login.html">Back to login</a></div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
