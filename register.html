<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — MindMate</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-auth-page="1">
<div class="auth-wrap">
  <div class="glass auth-card">
    <div class="logo"><div class="logo-mark">✨</div> MindMate</div>
    <h1>Create your account</h1>
    <p class="subtitle">Join MindMate and start chatting in seconds</p>

    <form id="register-form">
      <div class="form-group">
        <label class="field-label">Full Name</label>
        <input class="input" type="text" name="fullName" required placeholder="Jordan Smith">
      </div>
      <div class="form-group">
        <label class="field-label">Email</label>
        <input class="input" type="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="field-label">Phone</label>
        <input class="input" type="tel" name="phone" placeholder="+91 98765 43210">
      </div>
      <div class="form-group">
        <label class="field-label">Password</label>
        <div class="password-field">
          <input class="input" type="password" name="password" id="reg-password" required minlength="8" placeholder="At least 8 characters">
          <button type="button" class="toggle-pass" onclick="togglePasswordField('reg-password', this)">Show</button>
        </div>
      </div>
      <div class="form-group">
        <label class="field-label">Confirm Password</label>
        <input class="input" type="password" name="confirmPassword" required minlength="8" placeholder="Repeat password">
      </div>
      <div class="row-between" style="margin-bottom:6px;">
        <label class="checkbox-line"><input type="checkbox" name="terms"> I agree to the Terms &amp; Privacy Policy</label>
      </div>
      <button type="submit" class="btn btn-primary">Create Account</button>
      <div class="error-msg" id="auth-error"></div>
    </form>

    <div class="auth-footer">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
