<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — MindMate</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-auth-page="1">
<div class="auth-wrap">
  <div class="glass auth-card">
    <div class="logo"><div class="logo-mark">✨</div> MindMate</div>
    <h1>Set a new password</h1>
    <p class="subtitle">Choose a strong password you haven't used before</p>

    <form id="reset-form">
      <div class="form-group">
        <label class="field-label">New Password</label>
        <input class="input" type="password" name="password" required minlength="8" placeholder="At least 8 characters">
      </div>
      <div class="form-group">
        <label class="field-label">Confirm New Password</label>
        <input class="input" type="password" name="confirmPassword" required minlength="8" placeholder="Repeat password">
      </div>
      <button type="submit" class="btn btn-primary">Reset Password</button>
      <div class="error-msg" id="auth-error"></div>
    </form>

    <div class="auth-footer"><a href="login.html">Back to login</a></div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
