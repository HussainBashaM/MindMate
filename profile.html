<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — MindMate</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="logo"><div class="logo-mark">✨</div> MindMate</div>
    <a href="chat.html" class="btn btn-primary new-chat-btn" style="text-decoration:none;">+ New Chat</a>
    <nav class="sidebar-nav">
      <a class="sidebar-link" href="chat.html">💬 Chat</a>
      <a class="sidebar-link" href="history.html">🕘 History</a>
      <a class="sidebar-link" href="settings.html">⚙️ Settings</a>
    </nav>
    <div class="sidebar-footer" style="margin-top:auto;">
      <a href="profile.html" class="user-chip active" data-user-chip style="display:flex;"></a>
      <a href="#" class="sidebar-link" data-logout style="margin-top:4px;">🚪 Logout</a>
    </div>
  </aside>

  <main class="dash-main" style="overflow-y:auto;">
    <div class="dash-header">
      <button class="hamburger" style="margin-bottom:10px;">☰</button>
      <h1>Your Profile</h1>
    </div>

    <div class="glass card">
      <div class="profile-header">
        <div class="profile-avatar" id="profile-avatar">--</div>
        <div>
          <div class="profile-name" id="profile-name">Loading…</div>
          <div class="profile-email" id="profile-email"></div>
        </div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="glass stat-card">
        <div class="stat-value gradient-text" id="stat-conversations">–</div>
        <div class="stat-label">Total Conversations</div>
      </div>
      <div class="glass stat-card">
        <div class="stat-value gradient-text" id="stat-messages">–</div>
        <div class="stat-label">Total Messages</div>
      </div>
      <div class="glass stat-card">
        <div class="stat-value" id="stat-joined" style="font-size:18px;">–</div>
        <div class="stat-label">Member Since</div>
      </div>
    </div>

    <div class="glass card">
      <div class="card-title">Edit Profile</div>
      <form id="profile-form">
        <div class="form-grid">
          <div class="form-group">
            <label class="field-label">Full Name</label>
            <input class="input" type="text" name="fullName" required>
          </div>
          <div class="form-group">
            <label class="field-label">Email</label>
            <input class="input" type="email" name="email" disabled>
          </div>
          <div class="form-group">
            <label class="field-label">Phone</label>
            <input class="input" type="tel" name="phone">
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:8px;">Save Changes</button>
      </form>
    </div>
  </main>
</div>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
